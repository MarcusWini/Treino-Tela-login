<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <Style>
        /*CSS para centralizacao na pagina*/
        *{
            text-align: center;
            
            }
        form{
            background-color:aquamarine;
            width: 30%;
            margin: 0 auto;
            
        }

    </Style>
</head>
<body>
    
    
    <form action="">
        <legend><h1>Login</h1>
    <label >Usuario: <input type="text" name="usuario" id="usuario"></label><br><br>
    <label >Senha: <input type="password" name="senha" id="senha"> </label><br><br>

    <button onclick="login()"> Entrar </button>
    </form>
    <p>Esqueceu a senha?</p>
    <a href="#">Recuperar Senha</a>
</legend>
</body>
<script>
    
    function login(){

    const usuarioBanco = 'Marcus';
    const senhaBanco = 123;

    let usuario_digitado = document.getElementById('usuario').value;
    let senha_digitada = document.getElementById('senha').value;

        if (usuario_digitado !== usuarioBanco || senha_digitada != senhaBanco) {
          alert("Usuario ou senha errado! Digite novamente!");
          
        }
        else{
            alert('Usuario: '+usuario_digitado+' logado!');
        }
    }

</script>
</html>
